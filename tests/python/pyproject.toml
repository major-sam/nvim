[project]
dependencies = [
  "httpx",
  "gidgethub[httpx]>5.4.0",
  "django>6.1.1; os_name != 'nt'",
  "django>6.1.1; os_name == 'nt'",
]
[tool.pytest]
minversion = "9.0"
addopts = ["-ra", "-q"]
testpaths = ["tests", "integration"]
pythonpath = ["src"]
[tool.pytest.ini_options]
python_files = ["**/*_test.py", "**/test_*.py", "test_*.py"]
